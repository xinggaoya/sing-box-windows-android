name: Auto Update libbox AAR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "指定 sing-box tag（如 v1.12.0），留空则取最新 Release"
        required: false
        type: string
      include_legacy:
        description: "是否同时构建 libbox-legacy.aar"
        required: false
        default: false
        type: boolean
      create_pr:
        description: "构建后是否自动创建 PR"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-libbox:
    name: Build and Update libbox.aar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.0.13004108" "platforms;android-34"

      - name: Build libbox AAR
        id: build
        run: |
          chmod +x scripts/update-libbox.sh

          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            ARGS+=(--version "${{ inputs.version }}")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_legacy }}" = "true" ]; then
            ARGS+=(--include-legacy)
          fi

          scripts/update-libbox.sh "${ARGS[@]}"

          TAG=$(sed -n 's/^[[:space:]]*"tag":[[:space:]]*"\([^"]*\)".*/\1/p' app/libs/libbox.version.json | head -n1)
          COMMIT=$(sed -n 's/^[[:space:]]*"commit":[[:space:]]*"\([^"]*\)".*/\1/p' app/libs/libbox.version.json | head -n1)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar-${{ steps.build.outputs.tag }}
          path: |
            app/libs/libbox.aar
            app/libs/libbox-legacy.aar
            app/libs/libbox.version.json
          if-no-files-found: warn
          retention-days: 15

      - name: Create Pull Request
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_pr }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/auto-update-libbox
          delete-branch: true
          title: "chore(libbox): 自动更新 libbox 到 ${{ steps.build.outputs.tag }}"
          commit-message: "chore(libbox): update libbox to ${{ steps.build.outputs.tag }}"
          body: |
            自动化更新 `libbox.aar`

            - source tag: `${{ steps.build.outputs.tag }}`
            - source commit: `${{ steps.build.outputs.commit }}`
            - metadata: `app/libs/libbox.version.json`
          labels: |
            dependencies
            automated
          add-paths: |
            app/libs/libbox.aar
            app/libs/libbox-legacy.aar
            app/libs/libbox.version.json
