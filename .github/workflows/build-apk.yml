name: Build Signed APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update latest libbox AAR
        run: |
          chmod +x scripts/update-libbox.sh
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_PATH" ]; then
            ./scripts/update-libbox.sh --android-sdk "$SDK_PATH"
          else
            ./scripts/update-libbox.sh
          fi

      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "未找到 apksigner，跳过签名校验"
            exit 0
          fi

          find app/build/outputs/apk/release -name "*.apk" -print0 | while IFS= read -r -d '' apk; do
            echo "校验签名: $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
