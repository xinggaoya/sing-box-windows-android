android {
    namespace 'cn.moncn.sing_box_windows'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "cn.moncn.sing_box_windows"
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 由 splits.abi 负责拆分 ABI，避免与 ndk.abiFilters 冲突
    }

    signingConfigs {
        release {
            // 固定签名配置：供 CI 自动构建使用（按需求写死，不依赖环境变量）
            storeFile file("signing/release.jks")
            storePassword "singbox123456"
            keyAlias "singbox_release"
            keyPassword "singbox123456"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            // 开启 R8：裁剪未使用的 material-icons-extended 图标与反射代码，
            // 显著减小 APK 体积（图标库本身占 ~35MB dex）。
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // 诊断构建：debuggable（可用 run-as 抓取进程内 /proc 快照），
        // 但沿用发布签名，从而可以直接覆盖安装到设备上并保留用户数据。
        diagnostic {
            initWith debug
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            applicationIdSuffix ''
            versionNameSuffix '-diag'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }

    // 单元测试需要读取并渲染 Android 资源（Robolectric 图形模式）
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    splits {
        abi {
            enable true
            reset()
            // 可通过 -PabiIncludes=arm64-v8a 只构建单个 ABI，缩短本地调试构建时间
            include ((project.findProperty('abiIncludes') ?: 'arm64-v8a,armeabi-v7a,x86,x86_64').split(','))
            // 关闭通用包，按 ABI 输出独立 APK
            universalApk false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["libs"]
        }
    }
}

